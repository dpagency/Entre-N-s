<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Entre Nós — teste de ajuste interno</title>
<style>html{background:#020617;color:#f8fafc;font-family:system-ui}body{margin:0}main{box-sizing:border-box;max-width:480px;margin:0 auto;padding:16px}h1{font-size:24px}p{font-size:16px;line-height:1.5}.card{background:#172033;border:1px solid #334155;border-radius:16px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid div{padding:16px 6px;text-align:center;background:#263449;border-radius:12px}button{border:0;background:#10bfa6;color:#021515;font-size:17px;font-weight:700;padding:15px;border-radius:12px;width:100%}#readout{white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}</style>
<script>(function(){var sw=screen.width,iw=window.innerWidth;var ratio=iw/sw;if(sw<600&&ratio>1.7&&ratio<5){document.documentElement.style.width=sw+'px';document.documentElement.style.zoom=String(ratio);document.documentElement.dataset.adjusted='yes'}else{document.documentElement.dataset.adjusted='no'}})();</script></head><body><main><h1>Entre Nós — teste de leitura</h1><p>Esta página é independente e não modifica o jogo. Abra normalmente, sem mudar de navegador.</p><div class="card"><strong>Personagens</strong><div class="grid"><div>Alex</div><div>Joana</div><div>Ravi</div><div>Bia</div></div></div><button onclick="document.getElementById('status').textContent='Botão funcionando!'">Começar</button><p id="status"></p><div class="card"><strong>Diagnóstico</strong><div id="readout"></div></div></main><script>function show(){document.getElementById('readout').textContent='Tela: '+screen.width+'px\nLayout: '+innerWidth+'px\nEscala: '+(visualViewport?.scale??'?')+'\nAjuste: '+document.documentElement.dataset.adjusted+'\nZoom CSS: '+document.documentElement.style.zoom}show();addEventListener('resize',show)</script></body></html>
