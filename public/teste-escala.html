<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=320, initial-scale=1, maximum-scale=1, viewport-fit=cover"><title>Entre Nós — Teste de escala</title><style>*{box-sizing:border-box}html{font-family:system-ui;background:#020617;color:white}body{margin:0;padding:16px}main{width:100%;max-width:440px;margin:auto}h1{font-size:24px}p{font-size:16px;line-height:1.5}.card{background:#1e293b;padding:16px;border-radius:14px;margin:12px 0;font-size:16px}button{width:100%;min-height:52px;font-size:18px;background:#14b8a6;border:0;border-radius:12px;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row div{background:#334155;padding:16px;text-align:center;border-radius:12px}</style></head><body><main><h1>Teste de escala — Entre Nós</h1><p>Esta é uma página isolada. Não altera o jogo.</p><div class="card" id="measure">Verificando dimensões…</div><div class="row"><div>Alex</div><div>Joana</div><div>Ravi</div><div>Bia</div></div><p><button onclick="document.getElementById('status').textContent='Botão funcionando!'">Começar</button></p><p id="status">Observe se o texto aparece legível sem ampliar.</p></main><script>function check(){document.getElementById('measure').textContent='Tela: '+screen.width+'px | Layout: '+innerWidth+'px | Escala: '+(visualViewport?.scale||'n/d')}check();addEventListener('resize',check)</script></body></html>
