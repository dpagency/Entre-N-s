<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Some in-app browsers ignore width=device-width and open at desktop layout width.
      // Use the actual device screen width before the app's CSS is evaluated.
      (function () {
        if (!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) return;
        document.documentElement.classList.add('mobile-device');
        var viewport = document.querySelector('meta[name="viewport"]');
        var width = Math.round(window.screen.width);
        if (viewport && width >= 280 && width <= 768) {
          viewport.setAttribute('content', 'width=' + width + ', initial-scale=1.0, viewport-fit=cover');
        }
      })();
    </script>
    <title>Entre Nós — Guardiões da Convivência</title>
    <meta name="description" content="Jogo cooperativo de cartas e tabuleiro sobre ética no cotidiano do serviço público na Vila dos Encontros." />
    <meta property="og:title" content="Entre Nós — Guardiões da Convivência" />
    <meta property="og:description" content="Jogo cooperativo de cartas e tabuleiro sobre ética no cotidiano do serviço público na Vila dos Encontros." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
