<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Mark mobile browsers before styles load, without changing the viewport.
      (function () {
        if (!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) return;
        document.documentElement.classList.add('mobile-device');
        // Corrige visualizadores Android que usam layout de desktop.
        // Executa antes do React; navegadores com escala normal nao mudam.
        var screenWidth = window.screen.width;
        var layoutWidth = window.innerWidth;
        var factor = layoutWidth / screenWidth;
        if (screenWidth > 0 && screenWidth < 600 && factor > 1.7 && factor < 5) {
          document.documentElement.style.width = screenWidth + 'px';
          document.documentElement.style.zoom = String(factor);
          document.documentElement.classList.add('embedded-viewport-correction');
        }
      })();
    </script>
    <title>Entre Nós — Guardiões da Convivência</title>
    <meta name="description" content="Jogo cooperativo de cartas e tabuleiro sobre ética no cotidiano do serviço público na Vila dos Encontros." />
    <meta property="og:title" content="Entre Nós — Guardiões da Convivência" />
    <meta property="og:description" content="Jogo cooperativo de cartas e tabuleiro sobre ética no cotidiano do serviço público na Vila dos Encontros." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
